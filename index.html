function startProductionMode(){if(!confirm('⚠ MODE PRODUCTION ⚠\n\nCeci va effacer toutes les données de démonstration :\n• 3 clients de démo\n• 2 factures de démo\n• 2 dépenses de démo\n• 1 modèle récurrent de démo\n\nTes paramètres entreprise (NEQ, TPS, TVQ, etc.) sont CONSERVÉS.\nÀ partir de maintenant, seules les vraies données seront stockées.\n\nContinuer ?'))return;state.clients=[];state.invoices=[];state.expenses=[];state.recurringTemplates=[];state.settings.productionMode=true;state.settings.nextInvoiceNum=1;saveState();toast('🚀 Mode production activé — tu peux commencer à saisir tes vraies données');render()}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`backup-kj-solutions-${toISODate(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('✓ Sauvegarde téléchargée')}
function importBackup(e){const f=e.target.files[0];if(!f)return;if(!confirm('⚠ Remplacer toutes les données actuelles par le fichier de sauvegarde ?'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);state=d;saveState();toast('✓ Sauvegarde restaurée');render()}catch(err){alert('Fichier invalide : '+err.message)}};r.readAsText(f)}
function renderParametres(){const s=state.settings,field=(n,l,v,t='text')=>`<div><label class="label">${l}</label><input class="input" name="${n}" type="${t}" value="${escape(v??'')}"></div>`;return `${!s.productionMode?`<div class="card gc-rose p-4 mb-4"><div class="flex items-start gap-3"><div style="font-size:24px">🚀</div><div class="flex-1"><div class="font-semibold mb-1">Mode démo actif</div><div class="text-sm mb-3" style="color:var(--muted)">Tu es en mode démonstration avec des données fictives. Quand tu es prêt, passe en mode <b>production</b> : tes vraies données seront conservées et persistantes, plus jamais de réinitialisation accidentelle.</div><button class="btn btn-primary" onclick="startProductionMode()">🚀 Passer en mode production</button></div></div></div>`:`<div class="card gc-emerald p-4 mb-4"><div class="flex items-center gap-3"><div style="font-size:24px">✅</div><div class="flex-1"><div class="font-semibold">Mode production actif</div><div class="text-sm" style="color:var(--muted)">Tes données sont persistantes. Pense à faire des sauvegardes régulièrement ↓</div></div><button class="btn btn-secondary" onclick="exportBackup()">${I.download} Sauvegarder</button><label class="btn btn-secondary cursor-pointer">📥 Restaurer<input type="file" accept="application/json" onchange="importBackup(event)" style="display:none"></label></div></div>`}<form class="card p-6 max-w-3xl space-y-4" onsubmit="event.preventDefault(); saveSettings(this)"><div class="text-lg font-semibold">Paramètres entreprise</div><div class="grid grid-cols-2 gap-4">${field('companyName',"Nom de l'entreprise",s.companyName)}${field('email','Courriel',s.email)}${field('phone','Téléphone',s.phone)}${field('address','Adresse',s.address)}${field('city','Ville',s.city)}${field('postalCode','Code postal',s.postalCode)}${field('neq','NEQ',s.neq)}${field('tpsNumber','Numéro TPS',s.tpsNumber)}${field('tvqNumber','Numéro TVQ',s.tvqNumber)}${field('invoicePrefix','Préfixe facture',s.invoicePrefix)}${field('paymentTermDays','Délai paiement (jours)',s.paymentTermDays,'number')}</div><div class="flex justify-end pt-2"><button type="submit" class="btn btn-primary">Enregistrer</button></div></form>`}

// === RÉCUS — Upload + compression + stockage ===
function compressImage(file,maxWidth=1600,quality=0.78){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxWidth/img.width);const w=Math.round(img.width*scale),h=Math.round(img.height*scale);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=URL.createObjectURL(file)})}
function readAsDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function onReceiptUpload(file){if(!file){window._expForm.receiptDataUrl='';window._expForm.receiptName='';window._expForm.receiptType='';refreshExpForm();return}if(file.size>15*1024*1024)return alert('Fichier trop volumineux (max 15 Mo).');let dataUrl,name=file.name,type=file.type;if(type.startsWith('image/')){dataUrl=await compressImage(file);type='image/jpeg';name=name.replace(/\.[^.]+$/,'')+'.jpg'}else dataUrl=await readAsDataURL(file);window._expForm.receiptDataUrl=dataUrl;window._expForm.receiptName=name;window._expForm.receiptType=type;refreshExpForm()}
function viewReceipt(expId){const e=state.expenses.find(x=>x.id===expId);if(!e||!e.receiptDataUrl)return;const modal=document.createElement('div');modal.className='modal-bg';modal.onclick=ev=>{if(ev.target===modal)modal.remove()};const isImg=e.receiptType&&e.receiptType.startsWith('image/');modal.innerHTML=`<div class="card p-4 max-w-4xl max-h-[90vh] overflow-auto"><div class="flex items-center justify-between mb-3"><div class="font-semibold">${escape(e.receiptName||'Reçu')}</div><div class="flex gap-2"><a class="btn btn-secondary" href="${e.receiptDataUrl}" download="${escape(e.receiptName||'recu')}">${I.download} Télécharger</a><button class="btn btn-secondary" onclick="this.closest('.modal-bg').remove()">Fermer</button></div></div>${isImg?`<img src="${e.receiptDataUrl}" style="max-width:100%;border-radius:8px">`:`<iframe src="${e.receiptDataUrl}" style="width:80vw;height:75vh;border:1px solid var(--border);border-radius:8px"></iframe>`}</div>`;document.body.appendChild(modal)}

// === ARCHIVES — Reçus + factures de l'année + export ZIP comptable ===
let archiveYear=new Date().getFullYear();
function renderArchives(){const Y=archiveYear;const start=new Date(Y,0,1),end=new Date(Y,11,31,23,59,59);const invs=state.invoices.filter(i=>{const d=new Date(i.issueDate);return d>=start&&d<=end});const exps=state.expenses.filter(e=>{const d=new Date(e.date);return d>=start&&d<=end});const withReceipt=exps.filter(e=>e.receiptDataUrl);const without=exps.filter(e=>!e.receiptDataUrl);const Y2=new Date().getFullYear();return `<div class="card gc-emerald p-4 mb-4"><div class="flex items-start gap-3"><div style="font-size:24px">📁</div><div class="flex-1"><div class="font-semibold mb-1">Archives — Pièces justificatives ${Y}</div><div class="text-sm" style="color:var(--muted)">Tous tes reçus de l'année dans une galerie, plus la liste de toutes tes factures émises. Bouton <b>« 📦 Exporter pour le comptable »</b> → archive ZIP contenant les reçus, les CSV factures + dépenses, et le récapitulatif imprimable. Idéal pour la déclaration de revenus.</div></div></div></div><div class="card p-4 flex flex-wrap items-center gap-3 mb-4"><label class="label mb-0">Année</label><select class="input" style="width:auto" onchange="archiveYear=Number(this.value); render()">${[Y2-2,Y2-1,Y2,Y2+1].map(y=>`<option value="${y}" ${y===Y?'selected':''}>${y}</option>`).join('')}</select><div class="ml-auto"><button class="btn btn-primary" onclick="exportArchiveZip(${Y})">📦 Exporter pour le comptable (ZIP)</button></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">${statCard('Factures émises',invs.length+'',`gc-teal`,fmtCAD(invs.reduce((s,i)=>s+i.total,0)),'#0f766e')}${statCard('Reçus archivés',withReceipt.length+' / '+exps.length,'gc-emerald',`${without.length} dépense${without.length>1?'s':''} sans reçu`,'#10b981')}${statCard('Total dépenses',fmtCAD(exps.reduce((s,e)=>s+e.amount,0)),'gc-amber',null,'#f59e0b')}</div><div class="card p-4 mb-4"><div class="font-semibold mb-3">🧾 Galerie des reçus (${withReceipt.length})</div>${withReceipt.length===0?`<div class="text-center py-8" style="color:var(--muted)">Aucun reçu archivé pour ${Y}. Ajoute des reçus en éditant les dépenses (Dépenses → ${I.edit}).</div>`:`<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">${withReceipt.map(e=>{const cat=state.expenseCategories.find(c=>c.id===e.categoryId);const isImg=e.receiptType&&e.receiptType.startsWith('image/');return `<div class="card overflow-hidden cursor-pointer hover:shadow-lg transition" onclick="viewReceipt('${e.id}')"><div style="height:140px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;overflow:hidden">${isImg?`<img src="${e.receiptDataUrl}" style="max-width:100%;max-height:100%;object-fit:cover">`:`<div style="text-align:center;color:var(--muted)"><div style="font-size:32px">📄</div><div style="font-size:11px;margin-top:4px">PDF</div></div>`}</div><div class="p-2 text-xs"><div class="font-medium truncate" title="${escape(e.description)}">${escape(e.description)}</div><div style="color:var(--muted)" class="truncate">${fmtDate(e.date)} · ${fmtCAD(e.amount)}</div><div class="badge mt-1" style="background:#0f766e20;color:#0f766e;font-size:9px">${escape(cat?.name||'')}</div></div></div>`}).join('')}</div>`}</div><div class="card p-4 mb-4"><div class="font-semibold mb-3">📋 Factures émises en ${Y} (${invs.length})</div>${invs.length===0?`<div class="text-center py-8" style="color:var(--muted)">Aucune facture émise en ${Y}.</div>`:`<table class="w-full"><thead><tr><th>Numéro</th><th>Date</th><th>Client</th><th>Période</th><th class="text-right">Total</th><th>Statut</th><th></th></tr></thead><tbody>${invs.map(i=>{const c=state.clients.find(x=>x.id===i.clientId);const period=(i.servicePeriodStart||i.servicePeriodEnd)?`${i.servicePeriodStart?fmtDate(i.servicePeriodStart):'?'} → ${i.servicePeriodEnd?fmtDate(i.servicePeriodEnd):'?'}`:'—';return `<tr><td class="font-mono">${escape(i.number)}</td><td>${fmtDate(i.issueDate)}</td><td>${escape(c?.name||'')}</td><td style="color:var(--muted);font-size:11px">${period}</td><td class="text-right font-medium">${fmtCAD(i.total)}</td><td><span class="badge" style="background:#10b98120;color:#059669">${i.status==='PAID'?'Payée':i.status==='SENT'?'Envoyée':i.status}</span></td><td class="text-right"><button class="btn-ghost btn" onclick="printInvoice('${i.id}')">${I.eye}</button></td></tr>`}).join('')}</tbody></table>`}</div>${without.length>0?`<div class="card gc-amber p-4"><div class="font-semibold mb-2">⚠ Dépenses sans reçu (${without.length})</div><div class="text-sm mb-3" style="color:var(--muted)">Pense à ajouter une photo du reçu pour ces dépenses (clique modifier ${I.edit} dans Dépenses).</div><table class="w-full text-sm"><thead><tr><th>Date</th><th>Description</th><th>Fournisseur</th><th class="text-right">Montant</th></tr></thead><tbody>${without.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${escape(e.description)}</td><td>${escape(e.vendor||'—')}</td><td class="text-right">${fmtCAD(e.amount)}</td></tr>`).join('')}</tbody></table></div>`:''}`}

async function exportArchiveZip(Y){if(typeof JSZip==='undefined')return alert('JSZip non chargé — vérifie ta connexion internet.');toast('📦 Génération de l\'archive en cours...');const start=new Date(Y,0,1),end=new Date(Y,11,31,23,59,59);const invs=state.invoices.filter(i=>{const d=new Date(i.issueDate);return d>=start&&d<=end});const exps=state.expenses.filter(e=>{const d=new Date(e.date);return d>=start&&d<=end});const zip=new JSZip();
// CSV factures
const hF='Numéro,Date,Échéance,Période début,Période fin,Client,Statut,Sous-total taxable,Sous-total exonéré,TPS,TVQ,Total,Payé,Solde dû\n';
const rF=invs.map(i=>{const c=state.clients.find(x=>x.id===i.clientId),cl=s=>String(s??'').replace(/[",\n]/g,' ');return[i.number,i.issueDate,i.dueDate,i.servicePeriodStart||'',i.servicePeriodEnd||'',cl(c?.name),i.status,i.taxableBase,i.exemptBase,i.tps,i.tvq,i.total,i.amountPaid,i.amountDue].join(',')}).join('\n');
zip.file(`factures-${Y}.csv`,hF+rF);
// CSV dépenses
const hE='Date,Catégorie,CTI,RTI,Fournisseur,Description,Sous-total,TPS,TVQ,Total,Reçu attaché\n';
const rE=exps.map(e=>{const cat=state.expenseCategories.find(c=>c.id===e.categoryId),cl=s=>String(s??'').replace(/[",\n]/g,' ');return[e.date,cl(cat?.name),cat?.reclaimGST?'oui':'non',cat?.reclaimQST?'oui':'non',cl(e.vendor),cl(e.description),e.subtotal,e.tps,e.tvq,e.amount,e.receiptDataUrl?'oui':'non'].join(',')}).join('\n');
zip.file(`depenses-${Y}.csv`,hE+rE);
// Reçus dans dossier recus/
const recusFolder=zip.folder(`recus-${Y}`);
let receiptCount=0;
exps.forEach(e=>{if(e.receiptDataUrl){const ext=(e.receiptType&&e.receiptType.includes('pdf'))?'pdf':'jpg';const safeDesc=String(e.description||'depense').replace(/[^a-zA-Z0-9-]/g,'_').slice(0,40);const fname=`${e.date}_${safeDesc}_${e.id.slice(0,6)}.${ext}`;const b64=e.receiptDataUrl.split(',')[1];recusFolder.file(fname,b64,{base64:true});receiptCount++}});
// Récapitulatif HTML
exportRecapitulatifInline(Y,(htmlRecap)=>{
  zip.file(`recapitulatif-fiscal-${Y}-KJ-Solutions.html`,htmlRecap);
  // README
  const readme=`KJ SOLUTIONS — Dossier comptable ${Y}\n\nContenu de cette archive :\n• factures-${Y}.csv : toutes les factures émises\n• depenses-${Y}.csv : toutes les dépenses\n• recus-${Y}/ : ${receiptCount} reçu(s) (images JPG et PDF)\n• recapitulatif-fiscal-${Y}-KJ-Solutions.html : récapitulatif imprimable\n\nGénéré le ${new Date().toLocaleString('fr-CA')}\n\nKJ SOLUTIONS\nTPS ${state.settings.tpsNumber}\nTVQ ${state.settings.tvqNumber}\n${state.settings.email}\n`;
  zip.file('README.txt',readme);
  zip.generateAsync({type:'blob'}).then(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`dossier-comptable-KJ-Solutions-${Y}.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast(`✓ Archive ${Y} générée — ${invs.length} facture${invs.length>1?'s':''}, ${exps.length} dépense${exps.length>1?'s':''}, ${receiptCount} reçu${receiptCount>1?'s':''}`)});
});}

function exportRecapitulatifInline(Y,cb){const start=new Date(Y,0,1),end=new Date(Y,11,31,23,59,59);const invs=state.invoices.filter(i=>{const d=new Date(i.issueDate);return d>=start&&d<=end});const exps=state.expenses.filter(e=>{const d=new Date(e.date);return d>=start&&d<=end});const totRevTax=round2(invs.reduce((s,i)=>s+i.taxableBase,0)),totRevExe=round2(invs.reduce((s,i)=>s+i.exemptBase,0)),totTps=round2(invs.reduce((s,i)=>s+i.tps,0)),totTvq=round2(invs.reduce((s,i)=>s+i.tvq,0));const tpsITC=round2(exps.filter(e=>state.expenseCategories.find(c=>c.id===e.categoryId)?.reclaimGST).reduce((s,e)=>s+e.tps,0)),tvqITR=round2(exps.filter(e=>state.expenseCategories.find(c=>c.id===e.categoryId)?.reclaimQST).reduce((s,e)=>s+e.tvq,0)),totExp=round2(exps.reduce((s,e)=>s+e.amount,0));const totExpDed=round2(exps.reduce((s,e)=>{const c=state.expenseCategories.find(x=>x.id===e.categoryId);return s+(c?.reclaimGST&&c?.reclaimQST?e.subtotal:e.amount)},0)),profit=round2(totRevTax+totRevExe-totExpDed);const s=state.settings;const html=`<!DOCTYPE html><html lang="fr-CA"><head><meta charset="UTF-8"><title>Récap ${Y}</title><style>body{font-family:Arial,sans-serif;color:#1f2937;padding:2cm;max-width:800px;margin:0 auto}h1{color:#0b1220;font-size:28px;letter-spacing:.1em}h2{color:#0f766e;font-size:16px;margin-top:24px;border-bottom:2px solid #0f766e;padding-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}th{background:#0b1220;color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid #e5e7eb}.total-row{background:#ecfdf5;font-weight:700}.right{text-align:right}.small{color:#6b7280;font-size:11px}</style></head><body><h1>RÉCAPITULATIF ${Y}</h1><div style="font-weight:700">${s.companyName}</div><div class="small">TPS ${s.tpsNumber} · TVQ ${s.tvqNumber}</div><h2>Résumé annuel</h2><table><tr><td>Revenus taxables</td><td class="right">${fmtCAD(totRevTax)}</td></tr><tr><td>Revenus exonérés</td><td class="right">${fmtCAD(totRevExe)}</td></tr><tr class="total-row"><td>Total revenus</td><td class="right">${fmtCAD(totRevTax+totRevExe)}</td></tr><tr><td>Dépenses déductibles</td><td class="right">${fmtCAD(totExpDed)}</td></tr><tr class="total-row" style="background:${profit>=0?'#ecfdf5':'#fef2f2'}"><td>Profit net</td><td class="right">${fmtCAD(profit)}</td></tr></table><h2>TPS / TVQ</h2><table><tr><th>Taxe</th><th class="right">Perçue</th><th class="right">CTI/RTI</th><th class="right">À remettre</th></tr><tr><td>TPS</td><td class="right">${fmtCAD(totTps)}</td><td class="right">${fmtCAD(tpsITC)}</td><td class="right" style="font-weight:700">${fmtCAD(round2(totTps-tpsITC))}</td></tr><tr><td>TVQ</td><td class="right">${fmtCAD(totTvq)}</td><td class="right">${fmtCAD(tvqITR)}</td><td class="right" style="font-weight:700">${fmtCAD(round2(totTvq-tvqITR))}</td></tr></table><h2>Factures (${invs.length})</h2><table><tr><th>N°</th><th>Date</th><th>Période service</th><th>Client</th><th class="right">Total</th><th>Statut</th></tr>${invs.map(i=>{const c=state.clients.find(x=>x.id===i.clientId);const p=(i.servicePeriodStart||i.servicePeriodEnd)?`${i.servicePeriodStart?fmtDate(i.servicePeriodStart):'?'} → ${i.servicePeriodEnd?fmtDate(i.servicePeriodEnd):'?'}`:'—';return `<tr><td>${i.number}</td><td>${fmtDate(i.issueDate)}</td><td>${p}</td><td>${c?.name||''}</td><td class="right">${fmtCAD(i.total)}</td><td>${i.status}</td></tr>`}).join('')}</table><h2>Dépenses (${exps.length})</h2><table><tr><th>Date</th><th>Catégorie</th><th>Description</th><th>Reçu</th><th class="right">Total</th></tr>${exps.map(e=>{const c=state.expenseCategories.find(x=>x.id===e.categoryId);return `<tr><td>${fmtDate(e.date)}</td><td>${c?.name||''}</td><td>${e.description}</td><td>${e.receiptDataUrl?'✓ joint':'—'}</td><td class="right">${fmtCAD(e.amount)}</td></tr>`}).join('')}</table></body></html>`;cb(html)}

// === INIT ===
loadState();
if(localStorage.getItem('gf_theme')==='dark')document.documentElement.classList.add('dark');
runRecurringCheck();
render();
</script>
