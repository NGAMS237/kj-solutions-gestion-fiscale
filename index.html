<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#0f766e;--accent2:#14b8a6}
.dark{--bg:#0a0f1a;--card:#0f1729;--text:#e6ecf5;--muted:#94a3b8;--border:#1f2937}
body{background:var(--bg);color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:.75rem}
.input{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;width:100%}
.input:focus{outline:none;box-shadow:0 0 0 2px var(--accent)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-radius:.5rem;font-size:.875rem;font-weight:500;transition:all .15s;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,118,110,.3)}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--bg)}
.btn-ghost{background:transparent;color:var(--text);padding:.4rem}
.btn-ghost:hover{background:var(--bg)}
.badge{display:inline-flex;align-items:center;padding:.125rem .5rem;border-radius:9999px;font-size:.75rem;font-weight:500}
.label{font-size:.75rem;font-weight:500;color:var(--muted);margin-bottom:.25rem;display:block}
th{text-align:left;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.6rem .75rem;background:rgba(15,118,110,.04)}
td{padding:.75rem;font-size:.875rem;border-top:1px solid var(--border)}
tr:hover td{background:rgba(15,118,110,.03)}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.55rem .75rem;border-radius:.5rem;font-size:.875rem;color:var(--text);cursor:pointer;transition:all .15s}
.nav-item:hover{background:rgba(15,118,110,.08);transform:translateX(2px)}
.nav-item.active{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;box-shadow:0 4px 10px rgba(15,118,110,.25)}
.sidebar-header{background:linear-gradient(135deg,#0b1220,#0f766e);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.toast{position:fixed;top:1rem;right:1rem;padding:.75rem 1rem;border-radius:.5rem;box-shadow:0 10px 25px rgba(0,0,0,.15);z-index:60;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;font-size:.875rem}
.gc-teal{background:linear-gradient(135deg,rgba(15,118,110,.10),rgba(20,184,166,.05));border-color:rgba(15,118,110,.2)}
.gc-amber{background:linear-gradient(135deg,rgba(245,158,11,.10),rgba(251,191,36,.05));border-color:rgba(245,158,11,.2)}
.gc-rose{background:linear-gradient(135deg,rgba(239,68,68,.10),rgba(244,114,182,.05));border-color:rgba(239,68,68,.2)}
.gc-emerald{background:linear-gradient(135deg,rgba(16,185,129,.10),rgba(20,184,166,.05));border-color:rgba(16,185,129,.2)}
.gc-indigo{background:linear-gradient(135deg,rgba(99,102,241,.10),rgba(139,92,246,.05));border-color:rgba(99,102,241,.2)}
@media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible}#print-area{position:absolute;left:0;top:0;width:100%;padding:2cm;background:#fff;color:#000}.no-print{display:none!important}}
</style>

clients:[{id:'cl1',name:'Garderie Les Petits Soleils',type:'GARDERIE',email:'admin@petitssoleils.qc.ca',phone:'514-555-1010',city:'Montréal',active:true},{id:'cl2',name:'Marie Tremblay',type:'PARTICULIER',email:'marie@example.qc.ca',phone:'514-555-2020',city:'Laval',active:true},{id:'cl3',name:'Boutique Informatique Plus',type:'ENTREPRISE',email:'comptes@infoplus.ca',phone:'450-555-3030',city:'Longueuil',active:true}],
invoices:[{id:'inv1',number:'KJ-2026-0001',status:'SENT',clientId:'cl2',issueDate:'2026-04-15',dueDate:'2026-05-15',servicePeriodStart:'2026-04-01',servicePeriodEnd:'2026-04-14',items:[{activityId:'a3',description:'Entretien ménager résidentiel — 5h',quantity:5,unitPrice:40,taxStatus:'TAXABLE',lineTotal:200}],subtotal:200,taxableBase:200,exemptBase:0,tps:10,tvq:19.95,total:229.95,amountPaid:0,amountDue:229.95,payments:[],tpsRate:.05,tvqRate:.09975,notes:'',submittedToAccountant:false},{id:'inv2',number:'KJ-2026-0002',status:'PAID',clientId:'cl1',issueDate:'2026-04-30',dueDate:'2026-05-14',servicePeriodStart:'2026-04-17',servicePeriodEnd:'2026-04-30',items:[{activityId:'a2',description:'Assistance garderie — bimensuel (40h)',quantity:40,unitPrice:20,taxStatus:'EXEMPT',lineTotal:800}],subtotal:800,taxableBase:0,exemptBase:800,tps:0,tvq:0,total:800,amountPaid:800,amountDue:0,payments:[{id:'p1',date:'2026-05-02',amount:800,method:'INTERAC',reference:'INT-04302026',notes:''}],tpsRate:.05,tvqRate:.09975,paidAt:'2026-05-02',notes:'',submittedToAccountant:false}],

recurringTemplates:[{id:'rt1',name:'Garderie Les Petits Soleils — bimensuel',clientId:'cl1',interval:'BIWEEKLY',startDate:'2026-05-14',nextRunAt:'2026-05-28',lastRunAt:'2026-05-14',active:true,autoStatus:'SENT',items:[{activityId:'a2',description:'Assistance garderie — bimensuel (40h)',quantity:40,unitPrice:20,taxStatus:'EXEMPT'}],notes:'Service récurrent — généré automatiquement aux 2 semaines'}]
});
let state;
function loadState(){try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))||DEFAULT_STATE();if(!state.recurringTemplates)state.recurringTemplates=[];state.invoices.forEach(i=>{if(i.submittedToAccountant===undefined)i.submittedToAccountant=false;if(!i.payments){i.payments=i.amountPaid>0?[{id:uid(),date:i.paidAt||i.issueDate,amount:i.amountPaid,method:'INTERAC',reference:'',notes:'Paiement migré'}]:[]}if(i.servicePeriodStart===undefined)i.servicePeriodStart='';if(i.servicePeriodEnd===undefined)i.servicePeriodEnd=''});state.expenses.forEach(e=>{if(e.submittedToAccountant===undefined)e.submittedToAccountant=false})}catch{state=DEFAULT_STATE()}}
function totalPaid(inv){return round2((inv.payments||[]).reduce((s,p)=>s+Number(p.amount),0))}
function recomputeInvoice(inv){const paid=totalPaid(inv);inv.amountPaid=paid;inv.amountDue=Math.max(0,round2(inv.total-paid));if(inv.amountDue<=0.005&&paid>0){inv.status='PAID';inv.paidAt=inv.payments[inv.payments.length-1].date}else if(inv.status==='PAID'){inv.status='SENT';inv.paidAt=undefined}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function resetState(){if(confirm('Effacer toutes les données et recharger les données de démo ?')){state=DEFAULT_STATE();saveState();render()}}
const uid=()=>Math.random().toString(36).slice(2,10);
function toast(msg,ms=3500){const c=document.getElementById('toast-container'),t=document.createElement('div');t.className='toast';t.innerHTML=msg;c.appendChild(t);setTimeout(()=>t.remove(),ms)}
const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
function computeInvoiceTotals(items,tpsRate,tvqRate){const lines=items.map(i=>({...i,lineTotal:round2(i.quantity*i.unitPrice)}));let taxable=0,exempt=0;for(const l of lines){if(l.taxStatus==='TAXABLE')taxable+=l.lineTotal;else exempt+=l.lineTotal}taxable=round2(taxable);exempt=round2(exempt);const tps=round2(taxable*tpsRate),tvq=round2(taxable*tvqRate),subtotal=round2(taxable+exempt),total=round2(subtotal+tps+tvq);return{subtotal,taxableBase:taxable,exemptBase:exempt,tps,tvq,total,lines}}
function decomposeFromTotal(totalIncl,tpsRate,tvqRate){const subtotal=round2(totalIncl/(1+tpsRate+tvqRate)),tps=round2(subtotal*tpsRate),tvq=round2(subtotal*tvqRate),total=round2(subtotal+tps+tvq),delta=round2(totalIncl-total);return{subtotal:round2(subtotal+delta),tps,tvq,total:round2(totalIncl)}}
const fmtCAD=v=>new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD'}).format(Number(v??0));
const fmtDate=d=>d?new Date(d).toLocaleDateString('fr-CA'):'—';
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toISODate=d=>new Date(d).toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function intervalDays(i){return{WEEKLY:7,BIWEEKLY:14,MONTHLY:30,QUARTERLY:90}[i]||14}
function runRecurringCheck(){const today=new Date();today.setHours(0,0,0,0);let gen=0;state.recurringTemplates.forEach(t=>{if(!t.active)return;let nx=new Date(t.nextRunAt);while(nx<=today){const totals=computeInvoiceTotals(t.items,state.settings.tpsRate,state.settings.tvqRate);const year=nx.getFullYear();const num=`${state.settings.invoicePrefix}-${year}-${String(state.settings.nextInvoiceNum).padStart(4,'0')}`;state.settings.nextInvoiceNum++;const issueDate=toISODate(nx),dueDate=toISODate(addDays(nx,state.settings.paymentTermDays));const periodDays=intervalDays(t.interval);const spStart=toISODate(addDays(nx,-periodDays));const spEnd=toISODate(addDays(nx,-1));state.invoices.unshift({id:uid(),number:num,status:t.autoStatus||'SENT',clientId:t.clientId,issueDate,dueDate,servicePeriodStart:spStart,servicePeriodEnd:spEnd,notes:t.notes||'',items:totals.lines,subtotal:totals.subtotal,taxableBase:totals.taxableBase,exemptBase:totals.exemptBase,tps:totals.tps,tvq:totals.tvq,total:totals.total,amountPaid:0,amountDue:totals.total,payments:[],tpsRate:state.settings.tpsRate,tvqRate:state.settings.tvqRate,submittedToAccountant:false,fromRecurringId:t.id});t.lastRunAt=issueDate;nx=addDays(nx,intervalDays(t.interval));gen++}t.nextRunAt=toISODate(nx)});if(gen>0){saveState();toast(`✓ ${gen} facture${gen>1?'s':''} récurrente${gen>1?'s':''} générée${gen>1?'s':''} automatiquement`)}}
let currentPage='dashboard';

const I={dashboard:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',file:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>',repeat:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',receipt:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/></svg>',calc:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/></svg>',chart:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',briefcase:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',settings:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>',folder:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',camera:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',edit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',copy:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',download:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',eye:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',play:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',sun:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2"/></svg>',moon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>'};

function render(){document.getElementById('app').innerHTML=`${renderSidebar()}<main class="flex-1 min-w-0">${renderTopbar()}<div class="p-6">${renderPage()}</div></main>`;if(currentPage==='dashboard')drawDashboardCharts()}
function renderSidebar(){const items=[{k:'dashboard',l:'Tableau de bord',i:'dashboard'},{k:'clients',l:'Clients',i:'users'},{k:'factures',l:'Factures',i:'file'},{k:'recurrentes',l:'Récurrentes',i:'repeat'},{k:'depenses',l:'Dépenses',i:'receipt'},{k:'taxes',l:'TPS / TVQ',i:'calc'},{k:'rapports',l:'Rapports',i:'chart'},{k:'comptable',l:"Fin d'année",i:'briefcase'},{k:'archives',l:'Archives',i:'folder'},{k:'parametres',l:'Paramètres',i:'settings'}];return `<aside class="w-64 shrink-0 h-screen sticky top-0 border-r flex flex-col" style="border-color:var(--border);background:var(--card)"><div class="sidebar-header px-5 py-5"><div class="text-lg font-bold tracking-wide">${escape(state.settings.companyName)}</div><div class="text-xs opacity-80">Gestion fiscale · QC</div></div><nav class="p-3 space-y-1 flex-1 overflow-y-auto">${items.map(i=>`<div class="nav-item ${currentPage===i.k?'active':''}" onclick="navigate('${i.k}')">${I[i.i]} ${i.l}</div>`).join('')}</nav><div class="px-5 py-4 text-xs" style="color:var(--muted);border-top:1px solid var(--border)">${state.settings.productionMode?'<span style="color:#10b981;font-weight:600">● Production</span> · Données persistantes':'<span style="color:#f59e0b;font-weight:600">● Démo</span> · Données navigateur<button class="block mt-2 underline" onclick="resetState()">Réinitialiser démo</button>'}</div></aside>`}
function renderTopbar(){const titles={dashboard:'Tableau de bord',clients:'Clients',factures:'Factures',recurrentes:'Facturation récurrente',depenses:'Dépenses',taxes:'TPS / TVQ',rapports:'Rapports',comptable:"Fin d'année · Dossier comptable",archives:'Archives — Reçus & factures',parametres:'Paramètres'};const dark=document.documentElement.classList.contains('dark');return `<header class="sticky top-0 z-10 border-b backdrop-blur no-print" style="background:rgba(246,247,251,.85);border-color:var(--border)"><div class="px-6 py-3 flex items-center justify-between"><h1 class="text-lg font-semibold">${titles[currentPage]||''}</h1><button class="btn-ghost btn" onclick="toggleTheme()">${dark?I.sun:I.moon}</button></div></header>`}
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('gf_theme',document.documentElement.classList.contains('dark')?'dark':'light');render()}
function renderPage(){switch(currentPage){case 'dashboard':return renderDashboard();case 'clients':return renderClients();case 'factures':return renderFactures();case 'recurrentes':return renderRecurrentes();case 'depenses':return renderDepenses();case 'taxes':return renderTaxes();case 'rapports':return renderRapports();case 'comptable':return renderComptable();case 'archives':return renderArchives();case 'parametres':return renderParametres()}return ''}

function statCard(label,value,gradClass,sublabel,iconColor){return `<div class="card ${gradClass} p-4"><div class="flex items-start justify-between"><div><div class="text-xs font-semibold uppercase tracking-wide" style="color:var(--muted)">${label}</div><div class="mt-2 text-2xl font-bold">${value}</div>${sublabel?`<div class="mt-1 text-xs" style="color:var(--muted)">${sublabel}</div>`:''}</div><div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background:${iconColor};color:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></div></div></div>`}
function renderDashboard(){const now=new Date(),mStart=new Date(now.getFullYear(),now.getMonth(),1),mEnd=new Date(now.getFullYear(),now.getMonth()+1,0);const inM=d=>{const x=new Date(d);return x>=mStart&&x<=mEnd};const monthInv=state.invoices.filter(i=>inM(i.issueDate)),monthExp=state.expenses.filter(e=>inM(e.date));const revenue=monthInv.reduce((s,i)=>s+i.total,0),expense=monthExp.reduce((s,e)=>s+e.amount,0),profit=revenue-expense;const tpsCol=monthInv.reduce((s,i)=>s+i.tps,0),tvqCol=monthInv.reduce((s,i)=>s+i.tvq,0);const tpsITC=monthExp.filter(e=>state.expenseCategories.find(c=>c.id===e.categoryId)?.reclaimGST).reduce((s,e)=>s+e.tps,0);const tvqITR=monthExp.filter(e=>state.expenseCategories.find(c=>c.id===e.categoryId)?.reclaimQST).reduce((s,e)=>s+e.tvq,0);const taxesToRemit=round2(tpsCol+tvqCol-tpsITC-tvqITR);const unpaid=state.invoices.filter(i=>i.amountDue>0&&i.status!=='CANCELLED');const activeRec=state.recurringTemplates.filter(t=>t.active);const nextRec=activeRec.map(t=>({...t,days:Math.ceil((new Date(t.nextRunAt)-new Date())/86400000)})).sort((a,b)=>a.days-b.days)[0];
return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">${statCard('Revenus du mois',fmtCAD(revenue),'gc-emerald',null,'#10b981')}${statCard('Dépenses du mois',fmtCAD(expense),'gc-amber',null,'#f59e0b')}${statCard('Profit net',fmtCAD(profit),profit>=0?'gc-teal':'gc-rose',null,profit>=0?'#0f766e':'#ef4444')}${statCard('Taxes à remettre',fmtCAD(taxesToRemit),'gc-indigo',`TPS ${fmtCAD(tpsCol)} · TVQ ${fmtCAD(tvqCol)}`,'#6366f1')}</div>${activeRec.length>0?`<div class="card gc-teal p-4 mt-4 flex items-center justify-between"><div><div class="text-xs font-semibold uppercase tracking-wide" style="color:var(--muted)">Facturation récurrente</div><div class="mt-1 text-sm"><b>${activeRec.length}</b> modèle${activeRec.length>1?'s':''} actif${activeRec.length>1?'s':''}.${nextRec?` Prochaine génération : <b>${fmtDate(nextRec.nextRunAt)}</b> ${nextRec.days<=0?'<span class="badge ml-2" style="background:#ef4444;color:#fff">À générer maintenant !</span>':`(dans ${nextRec.days} jour${nextRec.days>1?'s':''})`}`:''}</div></div><button class="btn btn-primary" onclick="navigate('recurrentes')">Gérer ${I.play}</button></div>`:''}<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-6"><div class="card p-4 lg:col-span-2"><div class="font-semibold mb-3">Revenus & dépenses — 12 derniers mois</div><div style="height:280px"><canvas id="chart-monthly"></canvas></div></div><div class="card p-4"><div class="font-semibold mb-3">Revenus par activité (mois)</div><div style="height:280px"><canvas id="chart-activities"></canvas></div></div></div><div class="card mt-6"><div class="px-4 py-3 border-b" style="border-color:var(--border)"><span class="font-semibold">Factures impayées (${unpaid.length} · ${fmtCAD(unpaid.reduce((s,i)=>s+i.amountDue,0))})</span></div><table class="w-full"><thead><tr><th>Numéro</th><th>Client</th><th>Échéance</th><th class="text-right">Solde dû</th></tr></thead><tbody>${unpaid.length===0?`<tr><td colspan="4" class="text-center" style="color:var(--muted)">Aucune facture impayée 🎉</td></tr>`:unpaid.map(i=>{const c=state.clients.find(x=>x.id===i.clientId);return `<tr><td class="font-mono">${escape(i.number)}</td><td>${escape(c?.name||'')}</td><td>${fmtDate(i.dueDate)}</td><td class="text-right font-medium">${fmtCAD(i.amountDue)}</td></tr>`}).join('')}</tbody></table></div>`}
let chartMonthly,chartActivities;
function drawDashboardCharts(){const months=[];const now=new Date();for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),s=new Date(d.getFullYear(),d.getMonth(),1),e=new Date(d.getFullYear(),d.getMonth()+1,0);const rev=state.invoices.filter(x=>{const xd=new Date(x.issueDate);return xd>=s&&xd<=e}).reduce((a,x)=>a+x.total,0);const exp=state.expenses.filter(x=>{const xd=new Date(x.date);return xd>=s&&xd<=e}).reduce((a,x)=>a+x.amount,0);months.push({label:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,rev,exp})}if(chartMonthly)chartMonthly.destroy();chartMonthly=new Chart(document.getElementById('chart-monthly'),{type:'bar',data:{labels:months.map(m=>m.label),datasets:[{label:'Revenus',data:months.map(m=>m.rev),backgroundColor:'#0f766e',borderRadius:4},{label:'Dépenses',data:months.map(m=>m.exp),backgroundColor:'#f59e0b',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});const mStart=new Date(now.getFullYear(),now.getMonth(),1),mEnd=new Date(now.getFullYear(),now.getMonth()+1,0);const byAct={};state.invoices.forEach(inv=>{const d=new Date(inv.issueDate);if(d<mStart||d>mEnd)return;inv.items.forEach(it=>{const a=state.activities.find(x=>x.id===it.activityId),k=a?.name||'Autre',color=a?.color||'#94a3b8';byAct[k]=byAct[k]||{total:0,color};byAct[k].total+=it.lineTotal})});const labels=Object.keys(byAct);if(chartActivities)chartActivities.destroy();if(labels.length===0){document.getElementById('chart-activities').parentElement.innerHTML='<div class="h-full flex items-center justify-center text-sm" style="color:var(--muted)">Aucune facture ce mois-ci</div>';return}chartActivities=new Chart(document.getElementById('chart-activities'),{type:'doughnut',data:{labels,datasets:[{data:labels.map(l=>byAct[l].total),backgroundColor:labels.map(l=>byAct[l].color),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}
// === CLIENTS ===
function renderClients(){const tb={PARTICULIER:'background:#94a3b820;color:#475569',ENTREPRISE:'background:#6366f120;color:#4f46e5',GARDERIE:'background:#f59e0b20;color:#d97706'},tl={PARTICULIER:'Particulier',ENTREPRISE:'Entreprise',GARDERIE:'Garderie'};return `<div class="flex justify-end mb-4"><button class="btn btn-primary" onclick="openClientModal()">${I.plus} Nouveau client</button></div><div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>Nom</th><th>Type</th><th>Courriel</th><th>Téléphone</th><th>Ville</th><th>Factures</th><th></th></tr></thead><tbody>${state.clients.length===0?`<tr><td colspan="7" class="text-center" style="color:var(--muted)">Aucun client</td></tr>`:state.clients.map(c=>{const n=state.invoices.filter(i=>i.clientId===c.id).length;return `<tr><td class="font-medium">${escape(c.name)}</td><td><span class="badge" style="${tb[c.type]}">${tl[c.type]}</span></td><td style="color:var(--muted)">${escape(c.email||'—')}</td><td style="color:var(--muted)">${escape(c.phone||'—')}</td><td>${escape(c.city||'—')}</td><td class="text-right">${n}</td><td class="text-right"><button class="btn-ghost btn" onclick="openClientModal('${c.id}')">${I.edit}</button><button class="btn-ghost btn" style="color:#ef4444" onclick="deleteClient('${c.id}')">${I.trash}</button></td></tr>`}).join('')}</tbody></table></div>`}
function openClientModal(id){const c=id?state.clients.find(x=>x.id===id):{name:'',type:'PARTICULIER',email:'',phone:'',city:''};const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<form class="card p-6 w-full max-w-lg space-y-3" onsubmit="event.preventDefault(); saveClient(${id?`'${id}'`:'null'}, this)"><div class="text-lg font-semibold">${id?'Modifier':'Nouveau'} client</div><div><label class="label">Nom</label><input class="input" name="name" required value="${escape(c.name)}"/></div><div class="grid grid-cols-2 gap-3"><div><label class="label">Type</label><select class="input" name="type"><option value="PARTICULIER" ${c.type==='PARTICULIER'?'selected':''}>Particulier</option><option value="ENTREPRISE" ${c.type==='ENTREPRISE'?'selected':''}>Entreprise</option><option value="GARDERIE" ${c.type==='GARDERIE'?'selected':''}>Garderie</option></select></div><div><label class="label">Téléphone</label><input class="input" name="phone" value="${escape(c.phone||'')}"/></div></div><div><label class="label">Courriel</label><input class="input" type="email" name="email" value="${escape(c.email||'')}"/></div><div><label class="label">Ville</label><input class="input" name="city" value="${escape(c.city||'')}"/></div><div class="flex justify-end gap-2 pt-2"><button type="button" class="btn btn-secondary" onclick="this.closest('.modal-bg').remove()">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div></form>`;document.body.appendChild(m)}
function saveClient(id,form){const fd=new FormData(form);const data={name:fd.get('name'),type:fd.get('type'),email:fd.get('email'),phone:fd.get('phone'),city:fd.get('city'),active:true};if(id)Object.assign(state.clients.find(c=>c.id===id),data);else state.clients.push({id:uid(),...data});saveState();form.closest('.modal-bg').remove();render()}
function deleteClient(id){if(!confirm('Supprimer ce client ?'))return;state.clients=state.clients.filter(c=>c.id!==id);saveState();render()}

// === FACTURES (CRUD + duplicate) ===
function renderFactures(){const sl={DRAFT:{t:'Brouillon',c:'background:#94a3b820;color:#475569'},SENT:{t:'Envoyée',c:'background:#0f766e20;color:#0f766e'},PAID:{t:'Payée',c:'background:#10b98120;color:#059669'},OVERDUE:{t:'En retard',c:'background:#ef444420;color:#dc2626'},CANCELLED:{t:'Annulée',c:'background:#94a3b820;color:#94a3b8'}};return `<div class="flex justify-end mb-4"><button class="btn btn-primary" onclick="openInvoiceModal()">${I.plus} Nouvelle facture</button></div><div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>Numéro</th><th>Client</th><th>Émise</th><th>Échéance</th><th class="text-right">Total</th><th class="text-right">Solde dû</th><th>Statut</th><th></th></tr></thead><tbody>${state.invoices.length===0?`<tr><td colspan="8" class="text-center" style="color:var(--muted)">Aucune facture</td></tr>`:state.invoices.map(i=>{const c=state.clients.find(x=>x.id===i.clientId),s=sl[i.status];return `<tr><td class="font-mono">${escape(i.number)}${i.fromRecurringId?' <span class="badge ml-1" style="background:#0f766e20;color:#0f766e" title="Auto">⟳</span>':''}</td><td>${escape(c?.name||'')}</td><td>${fmtDate(i.issueDate)}</td><td>${fmtDate(i.dueDate)}</td><td class="text-right">${fmtCAD(i.total)}</td><td class="text-right font-medium">${fmtCAD(i.amountDue)}</td><td><span class="badge" style="${s.c}">${s.t}</span></td><td class="text-right whitespace-nowrap"><button class="btn-ghost btn" title="PDF" onclick="printInvoice('${i.id}')">${I.eye}</button><button class="btn-ghost btn" title="Modifier" onclick="openInvoiceModal('${i.id}')">${I.edit}</button><button class="btn-ghost btn" title="Dupliquer" onclick="duplicateInvoice('${i.id}')">${I.copy}</button>${i.amountDue>0?`<button class="btn-ghost btn" title="Enregistrer un paiement" onclick="openPaymentModal('${i.id}')">💰</button>`:''}${(i.payments&&i.payments.length>0)?`<button class="btn-ghost btn" title="Historique paiements (${i.payments.length})" onclick="openPaymentHistory('${i.id}')">📜</button>`:''}<button class="btn-ghost btn" style="color:#ef4444" onclick="deleteInvoice('${i.id}')">${I.trash}</button></td></tr>`}).join('')}</tbody></table></div>`}
function openInvoiceModal(editId){const today=toISODate(new Date()),dueDate=toISODate(addDays(new Date(),state.settings.paymentTermDays));let initial;if(editId){const ex=state.invoices.find(i=>i.id===editId);initial={editId,clientId:ex.clientId,issueDate:ex.issueDate,dueDate:ex.dueDate,servicePeriodStart:ex.servicePeriodStart||'',servicePeriodEnd:ex.servicePeriodEnd||'',notes:ex.notes||'',status:ex.status,items:JSON.parse(JSON.stringify(ex.items))}}else initial={editId:null,clientId:state.clients[0]?.id||'',issueDate:today,dueDate,servicePeriodStart:'',servicePeriodEnd:'',notes:'',status:'DRAFT',items:[{activityId:'',description:'',quantity:1,unitPrice:0,taxStatus:'TAXABLE'}]};window._invForm=initial;const modal=document.createElement('div');modal.className='modal-bg';modal.id='invoice-modal';modal.innerHTML=renderInvoiceForm();document.body.appendChild(modal)}
function renderInvoiceForm(){const f=window._invForm,totals=computeInvoiceTotals(f.items,state.settings.tpsRate,state.settings.tvqRate);return `<div class="card p-6 w-full max-w-5xl max-h-[90vh] overflow-y-auto"><div class="text-lg font-semibold mb-4">${f.editId?'Modifier la facture':'Nouvelle facture'}</div><div class="grid grid-cols-3 gap-3 mb-3"><div><label class="label">Client</label><select class="input" onchange="window._invForm.clientId=this.value">${state.clients.map(c=>`<option value="${c.id}" ${c.id===f.clientId?'selected':''}>${escape(c.name)}</option>`).join('')}</select></div><div><label class="label">Date d'émission</label><input class="input" type="date" value="${f.issueDate}" onchange="window._invForm.issueDate=this.value"></div><div><label class="label">Échéance</label><input class="input" type="date" value="${f.dueDate}" onchange="window._invForm.dueDate=this.value"></div></div><div class="card gc-teal p-3 mb-4"><div class="text-xs font-semibold mb-2" style="color:var(--muted)">PÉRIODE DE SERVICE (optionnel — quand le service a été rendu)</div><div class="grid grid-cols-2 gap-3"><div><label class="label">Du</label><input class="input" type="date" value="${f.servicePeriodStart||''}" onchange="window._invForm.servicePeriodStart=this.value"></div><div><label class="label">Au</label><input class="input" type="date" value="${f.servicePeriodEnd||''}" onchange="window._invForm.servicePeriodEnd=this.value"></div></div></div><div class="card overflow-x-auto mb-4"><table class="w-full"><thead><tr><th>Activité</th><th>Description</th><th class="text-right">Qté</th><th class="text-right">Prix unit.</th><th>Taxe</th><th class="text-right">Total</th><th></th></tr></thead><tbody>${f.items.map((it,idx)=>`<tr><td style="min-width:140px"><select class="input" onchange="onActChange(${idx}, this.value)"><option value="">—</option>${state.activities.map(a=>`<option value="${a.id}" ${a.id===it.activityId?'selected':''}>${escape(a.name)}</option>`).join('')}</select></td><td style="min-width:220px"><input class="input" value="${escape(it.description)}" oninput="window._invForm.items[${idx}].description=this.value"></td><td style="width:80px"><input class="input text-right" type="number" step="0.01" value="${it.quantity}" oninput="window._invForm.items[${idx}].quantity=Number(this.value); refreshInvForm()"></td><td style="width:100px"><input class="input text-right" type="number" step="0.01" value="${it.unitPrice}" oninput="window._invForm.items[${idx}].unitPrice=Number(this.value); refreshInvForm()"></td><td style="width:110px"><select class="input" onchange="window._invForm.items[${idx}].taxStatus=this.value; refreshInvForm()"><option value="TAXABLE" ${it.taxStatus==='TAXABLE'?'selected':''}>Taxable</option><option value="EXEMPT" ${it.taxStatus==='EXEMPT'?'selected':''}>Exonéré</option><option value="ZERO_RATED" ${it.taxStatus==='ZERO_RATED'?'selected':''}>0 %</option></select></td><td class="text-right">${fmtCAD(it.quantity*it.unitPrice)}</td><td><button class="btn-ghost btn" style="color:#ef4444" onclick="removeInvLine(${idx})">${I.trash}</button></td></tr>`).join('')}</tbody></table><div class="p-3 border-t" style="border-color:var(--border)"><button class="btn btn-secondary" onclick="addInvLine()">${I.plus} Ajouter une ligne</button></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Notes</label><textarea class="input" rows="3" oninput="window._invForm.notes=this.value">${escape(f.notes)}</textarea></div><div class="card gc-teal p-3 space-y-1 text-sm"><div class="flex justify-between"><span style="color:var(--muted)">Sous-total taxable</span><span>${fmtCAD(totals.taxableBase)}</span></div>${totals.exemptBase>0?`<div class="flex justify-between"><span style="color:var(--muted)">Sous-total exonéré</span><span>${fmtCAD(totals.exemptBase)}</span></div>`:''}<div class="flex justify-between"><span style="color:var(--muted)">TPS (5 %)</span><span>${fmtCAD(totals.tps)}</span></div><div class="flex justify-between"><span style="color:var(--muted)">TVQ (9.975 %)</span><span>${fmtCAD(totals.tvq)}</span></div><div class="flex justify-between pt-2 border-t font-bold text-base" style="border-color:var(--border)"><span>Total</span><span style="color:#0f766e">${fmtCAD(totals.total)}</span></div></div></div><div class="flex justify-end gap-2 mt-4"><button class="btn btn-secondary" onclick="document.getElementById('invoice-modal').remove()">Annuler</button>${!f.editId?`<button class="btn btn-secondary" onclick="saveInvoice('DRAFT')">Brouillon</button>`:''}<button class="btn btn-primary" onclick="saveInvoice('${f.editId?f.status:'SENT'}')">${f.editId?'Enregistrer':'Émettre & PDF'}</button></div></div>`}
function refreshInvForm(){document.getElementById('invoice-modal').innerHTML=renderInvoiceForm()}
function onActChange(idx,activityId){const a=state.activities.find(x=>x.id===activityId);window._invForm.items[idx].activityId=activityId;if(a)window._invForm.items[idx].taxStatus=a.taxStatus;refreshInvForm()}
function addInvLine(){window._invForm.items.push({activityId:'',description:'',quantity:1,unitPrice:0,taxStatus:'TAXABLE'});refreshInvForm()}
function removeInvLine(idx){if(window._invForm.items.length===1)return alert('Au moins une ligne est requise.');window._invForm.items.splice(idx,1);refreshInvForm()}
function saveInvoice(status){const f=window._invForm;if(!f.clientId)return alert('Sélectionne un client.');if(f.items.some(i=>!i.description||i.quantity<=0))return alert('Toutes les lignes doivent être complètes.');const totals=computeInvoiceTotals(f.items,state.settings.tpsRate,state.settings.tvqRate);if(f.editId){const inv=state.invoices.find(i=>i.id===f.editId);if(!inv)return;Object.assign(inv,{clientId:f.clientId,issueDate:f.issueDate,dueDate:f.dueDate,servicePeriodStart:f.servicePeriodStart,servicePeriodEnd:f.servicePeriodEnd,notes:f.notes,status,items:totals.lines,subtotal:totals.subtotal,taxableBase:totals.taxableBase,exemptBase:totals.exemptBase,tps:totals.tps,tvq:totals.tvq,total:totals.total});recomputeInvoice(inv);toast('✓ Facture modifiée')}else{const year=new Date(f.issueDate).getFullYear();const num=`${state.settings.invoicePrefix}-${year}-${String(state.settings.nextInvoiceNum).padStart(4,'0')}`;state.settings.nextInvoiceNum++;const invoice={id:uid(),number:num,status,clientId:f.clientId,issueDate:f.issueDate,dueDate:f.dueDate,servicePeriodStart:f.servicePeriodStart,servicePeriodEnd:f.servicePeriodEnd,notes:f.notes,items:totals.lines,subtotal:totals.subtotal,taxableBase:totals.taxableBase,exemptBase:totals.exemptBase,tps:totals.tps,tvq:totals.tvq,total:totals.total,amountPaid:0,amountDue:totals.total,payments:[],tpsRate:state.settings.tpsRate,tvqRate:state.settings.tvqRate,submittedToAccountant:false};state.invoices.unshift(invoice);saveState();document.getElementById('invoice-modal').remove();render();if(status==='SENT')printInvoice(invoice.id);return}saveState();document.getElementById('invoice-modal').remove();render()}
function duplicateInvoice(id){const src=state.invoices.find(i=>i.id===id);if(!src)return;const today=toISODate(new Date()),dueDate=toISODate(addDays(new Date(),state.settings.paymentTermDays));const year=new Date().getFullYear(),num=`${state.settings.invoicePrefix}-${year}-${String(state.settings.nextInvoiceNum).padStart(4,'0')}`;state.settings.nextInvoiceNum++;state.invoices.unshift({...JSON.parse(JSON.stringify(src)),id:uid(),number:num,status:'DRAFT',issueDate:today,dueDate,amountPaid:0,amountDue:src.total,paidAt:undefined,payments:[],servicePeriodStart:'',servicePeriodEnd:'',submittedToAccountant:false,fromRecurringId:undefined});saveState();toast('✓ Facture dupliquée en brouillon');render()}
function openPaymentModal(id){const inv=state.invoices.find(i=>i.id===id);if(!inv)return;window._payForm={invoiceId:id,date:toISODate(new Date()),amount:inv.amountDue,method:'INTERAC',reference:'',notes:''};const modal=document.createElement('div');modal.className='modal-bg';modal.id='pay-modal';modal.innerHTML=renderPaymentForm(inv);document.body.appendChild(modal)}
function renderPaymentForm(inv){const f=window._payForm,c=state.clients.find(x=>x.id===inv.clientId);const methods=['INTERAC','VIREMENT','COMPTANT','CHEQUE','CARTE','STRIPE','AUTRE'];const mLbl={INTERAC:'Virement Interac',VIREMENT:'Virement bancaire',COMPTANT:'Comptant',CHEQUE:'Chèque',CARTE:'Carte de crédit/débit',STRIPE:'Stripe',AUTRE:'Autre'};return `<form class="card p-6 w-full max-w-xl space-y-3" onsubmit="event.preventDefault(); recordPayment()"><div class="text-lg font-semibold mb-1">💰 Enregistrer un paiement</div><div class="card gc-teal p-3 mb-2"><div class="text-xs" style="color:var(--muted)">Facture concernée</div><div class="font-bold">${escape(inv.number)} — ${escape(c?.name||'')}</div><div class="flex justify-between mt-1 text-sm"><span style="color:var(--muted)">Total / Payé / Solde dû</span><span><b>${fmtCAD(inv.total)}</b> · ${fmtCAD(inv.amountPaid)} · <b style="color:#dc2626">${fmtCAD(inv.amountDue)}</b></span></div></div><div class="grid grid-cols-2 gap-3"><div><label class="label">Date du paiement</label><input class="input" type="date" value="${f.date}" oninput="window._payForm.date=this.value" required></div><div><label class="label">Montant reçu</label><input class="input" type="number" step="0.01" min="0.01" max="${inv.amountDue}" value="${f.amount}" oninput="window._payForm.amount=Number(this.value)" required></div></div><div class="grid grid-cols-2 gap-3"><div><label class="label">Méthode de paiement</label><select class="input" onchange="window._payForm.method=this.value">${methods.map(m=>`<option value="${m}" ${m===f.method?'selected':''}>${mLbl[m]}</option>`).join('')}</select></div><div><label class="label">Référence / N° transaction</label><input class="input" value="${escape(f.reference)}" oninput="window._payForm.reference=this.value" placeholder="Ex: INT-12345"></div></div><div><label class="label">Notes (optionnel)</label><textarea class="input" rows="2" oninput="window._payForm.notes=this.value">${escape(f.notes)}</textarea></div><div class="flex justify-end gap-2 pt-2"><button type="button" class="btn btn-secondary" onclick="document.getElementById('pay-modal').remove()">Annuler</button><button type="submit" class="btn btn-primary">💰 Enregistrer le paiement</button></div></form>`}
function recordPayment(){const f=window._payForm,inv=state.invoices.find(i=>i.id===f.invoiceId);if(!inv)return;if(f.amount<=0)return alert('Montant invalide.');if(f.amount>inv.amountDue+0.01)return alert(`Montant supérieur au solde dû (${fmtCAD(inv.amountDue)}).`);if(!inv.payments)inv.payments=[];inv.payments.push({id:uid(),date:f.date,amount:round2(f.amount),method:f.method,reference:f.reference,notes:f.notes});recomputeInvoice(inv);saveState();document.getElementById('pay-modal').remove();const msg=inv.amountDue<=0?'✓ Paiement enregistré — facture PAYÉE intégralement':`✓ Paiement de ${fmtCAD(f.amount)} enregistré — solde restant ${fmtCAD(inv.amountDue)}`;toast(msg);render()}
function openPaymentHistory(id){const inv=state.invoices.find(i=>i.id===id);if(!inv||!inv.payments||inv.payments.length===0)return alert('Aucun paiement enregistré.');const c=state.clients.find(x=>x.id===inv.clientId);const mLbl={INTERAC:'Interac',VIREMENT:'Virement',COMPTANT:'Comptant',CHEQUE:'Chèque',CARTE:'Carte',STRIPE:'Stripe',AUTRE:'Autre'};const modal=document.createElement('div');modal.className='modal-bg';modal.id='hist-modal';modal.innerHTML=`<div class="card p-6 w-full max-w-3xl"><div class="text-lg font-semibold mb-1">📜 Historique des paiements</div><div class="text-sm mb-4" style="color:var(--muted)">${escape(inv.number)} — ${escape(c?.name||'')}</div><div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>Date</th><th>Méthode</th><th>Référence</th><th>Notes</th><th class="text-right">Montant</th><th></th></tr></thead><tbody>${inv.payments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${mLbl[p.method]||p.method}</td><td>${escape(p.reference||'—')}</td><td style="color:var(--muted)">${escape(p.notes||'')}</td><td class="text-right font-medium">${fmtCAD(p.amount)}</td><td class="text-right"><button class="btn-ghost btn" style="color:#ef4444" onclick="deletePayment('${inv.id}','${p.id}')">${I.trash}</button></td></tr>`).join('')}<tr class="font-bold" style="background:rgba(15,118,110,.08)"><td colspan="4">Total payé</td><td class="text-right">${fmtCAD(inv.amountPaid)}</td><td></td></tr><tr class="font-bold" style="background:${inv.amountDue>0?'rgba(239,68,68,.08)':'rgba(16,185,129,.08)'}"><td colspan="4">Solde restant</td><td class="text-right" style="color:${inv.amountDue>0?'#dc2626':'#059669'}">${fmtCAD(inv.amountDue)}</td><td></td></tr></tbody></table></div><div class="flex justify-end gap-2 mt-4">${inv.amountDue>0?`<button class="btn btn-primary" onclick="document.getElementById('hist-modal').remove(); openPaymentModal('${inv.id}')">💰 Nouveau paiement</button>`:''}<button class="btn btn-secondary" onclick="document.getElementById('hist-modal').remove()">Fermer</button></div></div>`;document.body.appendChild(modal)}
function deletePayment(invId,payId){if(!confirm('Supprimer ce paiement ?'))return;const inv=state.invoices.find(i=>i.id===invId);if(!inv)return;inv.payments=inv.payments.filter(p=>p.id!==payId);recomputeInvoice(inv);saveState();toast('✓ Paiement supprimé');document.getElementById('hist-modal').remove();render()}
function deleteInvoice(id){if(!confirm('Supprimer cette facture ?'))return;state.invoices=state.invoices.filter(i=>i.id!==id);saveState();render()}
// === PDF ÉPURÉ ===
function printInvoice(id){const inv=state.invoices.find(i=>i.id===id),c=state.clients.find(x=>x.id===inv.clientId),s=state.settings;const sFR={DRAFT:'Brouillon',SENT:'Envoyée',PAID:'Payée',OVERDUE:'En retard',CANCELLED:'Annulée'};const tl=t=>t==='EXEMPT'?'Exonéré':t==='ZERO_RATED'?'0 %':'Taxable';const A='#0f766e',A2='#14b8a6',DK='#0b1220',TX='#1f2937',MU='#6b7280',LN='#e5e7eb';const sc={DRAFT:'#6b7280',SENT:'#0f766e',PAID:'#059669',OVERDUE:'#dc2626',CANCELLED:'#94a3b8'};const a=document.getElementById('print-area');a.classList.remove('hidden');a.innerHTML=`<style>.pdf-doc{font-family:'Helvetica Neue',Arial,sans-serif;color:${TX};line-height:1.5;max-width:740px;margin:0 auto;position:relative}.pdf-doc::before{content:'';position:absolute;top:-20px;left:-20px;right:-20px;height:8px;background:linear-gradient(90deg,${A},${A2});border-radius:2px}.pdf-doc h1{font-size:32px;font-weight:300;letter-spacing:.15em;color:${DK};margin:0;text-transform:uppercase}.pdf-doc .logo-box{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;background:linear-gradient(135deg,${A},${A2});color:#fff;font-weight:700;font-size:22px;border-radius:12px}.pdf-doc .company{font-size:17px;font-weight:700;color:${DK};letter-spacing:.04em;margin-bottom:4px}.pdf-doc .small{font-size:10.5px;color:${MU};line-height:1.7}.pdf-doc .tag{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:${MU};font-weight:600}.pdf-doc .num{font-family:'Courier New',monospace;font-size:14px;font-weight:700;color:${DK};padding:4px 10px;background:${A}10;border-radius:4px;display:inline-block}.pdf-doc table.items{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}.pdf-doc table.items th{text-align:left;padding:12px 10px;color:#fff;font-weight:600;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;background:${DK}}.pdf-doc table.items th:first-child{border-radius:6px 0 0 6px}.pdf-doc table.items th:last-child{border-radius:0 6px 6px 0}.pdf-doc table.items td{padding:12px 10px;border-bottom:1px solid ${LN};vertical-align:top}.pdf-doc table.items tbody tr:nth-child(even) td{background:${A}04}.pdf-doc .total-box{background:linear-gradient(135deg,${A},${A2});color:#fff;padding:14px 18px;border-radius:10px;margin-top:10px}.pdf-doc .total-box .lbl{color:rgba(255,255,255,.85);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.pdf-doc .total-box .val{font-size:22px;font-weight:700}.pdf-doc .footer{margin-top:60px;padding-top:18px;border-top:1px solid ${LN};font-size:9px;color:${MU};text-align:center}.pdf-doc .status{display:inline-block;padding:4px 12px;border-radius:12px;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff}.pdf-doc .right{text-align:right;font-variant-numeric:tabular-nums}.pdf-doc table.totals td{padding:5px 0;font-size:11.5px}.pdf-doc table.totals .lbl{color:${MU};text-align:right;padding-right:18px}.pdf-doc table.totals .val{text-align:right;min-width:110px}</style><div class="pdf-doc"><table style="width:100%;border:none;margin-top:8px"><tr><td style="vertical-align:top"><table><tr><td style="padding-right:14px"><div class="logo-box">${escape(s.companyName.substring(0,2).toUpperCase())}</div></td><td><div class="company">${escape(s.companyName).toUpperCase()}</div><div class="small">${s.address?escape(s.address)+'<br>':''}${[s.city,s.province,s.postalCode].filter(Boolean).map(escape).join(' ')}<br>${s.phone?escape(s.phone)+'<br>':''}${s.email?escape(s.email):''}</div></td></tr></table></td><td style="vertical-align:top;text-align:right"><h1>Facture</h1><div style="margin-top:10px"><span class="num">${escape(inv.number)}</span></div><div style="margin-top:10px"><span class="status" style="background:${sc[inv.status]}">${sFR[inv.status]}</span></div></td></tr></table><table style="width:100%;margin-top:36px;border:none"><tr><td style="width:50%;vertical-align:top;padding-right:24px"><div class="tag">Facturer à</div><div style="font-size:14px;font-weight:700;color:${DK};margin:6px 0 4px">${escape(c?.name||'')}</div><div class="small">${c?.address?escape(c.address)+'<br>':''}${c?.city?escape(c.city)+(c?.province?', '+escape(c.province):'')+'<br>':''}${c?.email?escape(c.email)+'<br>':''}${c?.phone?escape(c.phone):''}</div></td><td style="width:50%;vertical-align:top"><table style="width:100%;font-size:11px"><tr><td class="tag" style="padding:5px 0">Émise le</td><td class="right" style="padding:5px 0;font-weight:600">${fmtDate(inv.issueDate)}</td></tr><tr><td class="tag" style="padding:5px 0">Échéance</td><td class="right" style="padding:5px 0;font-weight:700;color:${A}">${fmtDate(inv.dueDate)}</td></tr>${s.tpsNumber?`<tr><td class="tag" style="padding:5px 0">N° TPS</td><td class="right" style="padding:5px 0;font-family:monospace;font-size:10px">${escape(s.tpsNumber)}</td></tr>`:''}${s.tvqNumber?`<tr><td class="tag" style="padding:5px 0">N° TVQ</td><td class="right" style="padding:5px 0;font-family:monospace;font-size:10px">${escape(s.tvqNumber)}</td></tr>`:''}</table></td></tr></table><table class="items" style="margin-top:30px"><thead><tr><th>Description</th><th class="right" style="width:60px">Qté</th><th class="right" style="width:90px">Prix unit.</th><th class="right" style="width:80px">Taxe</th><th class="right" style="width:100px">Montant</th></tr></thead><tbody>${inv.items.map(it=>`<tr><td>${escape(it.description)}</td><td class="right">${it.quantity}</td><td class="right">${fmtCAD(it.unitPrice)}</td><td class="right" style="color:${MU};font-size:10px">${tl(it.taxStatus)}</td><td class="right" style="font-weight:600">${fmtCAD(it.lineTotal)}</td></tr>`).join('')}</tbody></table><table style="width:100%;margin-top:20px;border:none"><tr><td style="width:55%"></td><td style="width:45%"><table class="totals" style="width:100%">${inv.taxableBase>0?`<tr><td class="lbl">Sous-total taxable</td><td class="val">${fmtCAD(inv.taxableBase)}</td></tr>`:''}${inv.exemptBase>0?`<tr><td class="lbl">Sous-total exonéré</td><td class="val">${fmtCAD(inv.exemptBase)}</td></tr>`:''}${inv.tps>0?`<tr><td class="lbl">TPS (${(inv.tpsRate*100).toFixed(0)} %)</td><td class="val">${fmtCAD(inv.tps)}</td></tr>`:''}${inv.tvq>0?`<tr><td class="lbl">TVQ (${(inv.tvqRate*100).toFixed(3)} %)</td><td class="val">${fmtCAD(inv.tvq)}</td></tr>`:''}</table><div class="total-box"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">Total à payer</span><span class="val">${fmtCAD(inv.total)}</span></div></div>${inv.amountPaid>0?`<table class="totals" style="width:100%;margin-top:6px"><tr><td class="lbl" style="color:#047857">Reçu</td><td class="val" style="color:#047857">− ${fmtCAD(inv.amountPaid)}</td></tr>${inv.amountDue>0?`<tr><td class="lbl" style="font-weight:700;color:${DK}">Solde dû</td><td class="val" style="font-weight:700;color:${DK}">${fmtCAD(inv.amountDue)}</td></tr>`:''}</table>`:''}</td></tr></table>${inv.notes?`<div style="margin-top:30px;padding:14px 16px;background:#f9fafb;border-left:4px solid ${A};border-radius:4px;font-size:10.5px"><div class="tag" style="margin-bottom:6px">Notes</div>${escape(inv.notes).replace(/\n/g,'<br>')}</div>`:''}<div class="footer">Merci pour votre confiance — <b>${escape(s.companyName)}</b><br>${[s.tpsNumber?'TPS '+escape(s.tpsNumber):null,s.tvqNumber?'TVQ '+escape(s.tvqNumber):null,s.neq?'NEQ '+escape(s.neq):null].filter(Boolean).join(' · ')}</div></div>`;window.print();setTimeout(()=>{a.classList.add('hidden');a.innerHTML=''},1000)}

// === RÉCURRENTES ===
function renderRecurrentes(){const iFR={WEEKLY:'Hebdomadaire',BIWEEKLY:'Aux 2 semaines',MONTHLY:'Mensuel',QUARTERLY:'Trimestriel'};return `<div class="card gc-teal p-4 mb-4"><div class="flex items-start gap-3"><div style="font-size:24px">⏱️</div><div class="flex-1"><div class="font-semibold mb-1">Comment ça marche</div><div class="text-sm" style="color:var(--muted)">Crée un modèle pour chaque client récurrent (ex: garderie aux 2 semaines). À chaque ouverture de la plateforme, les factures dues sont <b>générées automatiquement</b> avec la bonne date et le bon numéro.</div></div></div></div><div class="flex justify-between items-center mb-4"><button class="btn btn-secondary" onclick="forceRecurringRun()">${I.play} Générer maintenant les factures dues</button><button class="btn btn-primary" onclick="openRecurringModal()">${I.plus} Nouveau modèle</button></div><div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>Nom</th><th>Client</th><th>Fréquence</th><th>Prochaine</th><th>Dernière</th><th class="text-right">Montant</th><th>Statut</th><th></th></tr></thead><tbody>${state.recurringTemplates.length===0?`<tr><td colspan="8" class="text-center" style="color:var(--muted)">Aucun modèle — clique « Nouveau modèle »</td></tr>`:state.recurringTemplates.map(t=>{const c=state.clients.find(x=>x.id===t.clientId),totals=computeInvoiceTotals(t.items,state.settings.tpsRate,state.settings.tvqRate),overdue=new Date(t.nextRunAt)<=new Date();return `<tr><td class="font-medium">${escape(t.name)}</td><td>${escape(c?.name||'—')}</td><td>${iFR[t.interval]||t.interval}</td><td>${fmtDate(t.nextRunAt)} ${overdue&&t.active?'<span class="badge ml-1" style="background:#ef4444;color:#fff">DUE</span>':''}</td><td>${t.lastRunAt?fmtDate(t.lastRunAt):'—'}</td><td class="text-right">${fmtCAD(totals.total)}</td><td><span class="badge" style="${t.active?'background:#10b98120;color:#059669':'background:#94a3b820;color:#94a3b8'}">${t.active?'Active':'Pausée'}</span></td><td class="text-right whitespace-nowrap"><button class="btn-ghost btn" onclick="openRecurringModal('${t.id}')">${I.edit}</button><button class="btn-ghost btn" onclick="toggleRecurring('${t.id}')">${t.active?'⏸':'▶️'}</button><button class="btn-ghost btn" style="color:#ef4444" onclick="deleteRecurring('${t.id}')">${I.trash}</button></td></tr>`}).join('')}</tbody></table></div>`}
function openRecurringModal(id){let initial;if(id){const t=state.recurringTemplates.find(x=>x.id===id);initial={editId:id,...JSON.parse(JSON.stringify(t))}}else initial={editId:null,id:uid(),name:'',clientId:state.clients[0]?.id||'',interval:'BIWEEKLY',startDate:toISODate(new Date()),nextRunAt:toISODate(new Date()),lastRunAt:null,active:true,autoStatus:'SENT',notes:'',items:[{activityId:'',description:'',quantity:1,unitPrice:0,taxStatus:'TAXABLE'}]};window._recForm=initial;const modal=document.createElement('div');modal.className='modal-bg';modal.id='rec-modal';modal.innerHTML=renderRecForm();document.body.appendChild(modal)}
function renderRecForm(){const f=window._recForm,totals=computeInvoiceTotals(f.items,state.settings.tpsRate,state.settings.tvqRate);return `<div class="card p-6 w-full max-w-4xl max-h-[90vh] overflow-y-auto"><div class="text-lg font-semibold mb-4">${f.editId?'Modifier le modèle':'Nouveau modèle récurrent'}</div><div class="grid grid-cols-2 gap-3 mb-4"><div><label class="label">Nom du modèle</label><input class="input" value="${escape(f.name)}" oninput="window._recForm.name=this.value" placeholder="Ex: Garderie X — bimensuel"></div><div><label class="label">Client</label><select class="input" onchange="window._recForm.clientId=this.value">${state.clients.map(c=>`<option value="${c.id}" ${c.id===f.clientId?'selected':''}>${escape(c.name)}</option>`).join('')}</select></div></div><div class="grid grid-cols-3 gap-3 mb-4"><div><label class="label">Fréquence</label><select class="input" onchange="window._recForm.interval=this.value"><option value="WEEKLY" ${f.interval==='WEEKLY'?'selected':''}>Hebdomadaire</option><option value="BIWEEKLY" ${f.interval==='BIWEEKLY'?'selected':''}>Aux 2 semaines</option><option value="MONTHLY" ${f.interval==='MONTHLY'?'selected':''}>Mensuel</option><option value="QUARTERLY" ${f.interval==='QUARTERLY'?'selected':''}>Trimestriel</option></select></div><div><label class="label">Première génération</label><input class="input" type="date" value="${f.nextRunAt}" onchange="window._recForm.nextRunAt=this.value; window._recForm.startDate=this.value"></div><div><label class="label">Statut auto</label><select class="input" onchange="window._recForm.autoStatus=this.value"><option value="DRAFT" ${f.autoStatus==='DRAFT'?'selected':''}>Brouillon</option><option value="SENT" ${f.autoStatus==='SENT'?'selected':''}>Envoyée</option></select></div></div><div class="card overflow-x-auto mb-4"><table class="w-full"><thead><tr><th>Activité</th><th>Description</th><th class="text-right">Qté</th><th class="text-right">Prix</th><th>Taxe</th><th class="text-right">Total</th><th></th></tr></thead><tbody>${f.items.map((it,idx)=>`<tr><td style="min-width:140px"><select class="input" onchange="onRecActChange(${idx}, this.value)"><option value="">—</option>${state.activities.map(a=>`<option value="${a.id}" ${a.id===it.activityId?'selected':''}>${escape(a.name)}</option>`).join('')}</select></td><td style="min-width:200px"><input class="input" value="${escape(it.description)}" oninput="window._recForm.items[${idx}].description=this.value"></td><td style="width:80px"><input class="input text-right" type="number" step="0.01" value="${it.quantity}" oninput="window._recForm.items[${idx}].quantity=Number(this.value); refreshRecForm()"></td><td style="width:100px"><input class="input text-right" type="number" step="0.01" value="${it.unitPrice}" oninput="window._recForm.items[${idx}].unitPrice=Number(this.value); refreshRecForm()"></td><td style="width:110px"><select class="input" onchange="window._recForm.items[${idx}].taxStatus=this.value; refreshRecForm()"><option value="TAXABLE" ${it.taxStatus==='TAXABLE'?'selected':''}>Taxable</option><option value="EXEMPT" ${it.taxStatus==='EXEMPT'?'selected':''}>Exonéré</option></select></td><td class="text-right">${fmtCAD(it.quantity*it.unitPrice)}</td><td><button class="btn-ghost btn" style="color:#ef4444" onclick="removeRecLine(${idx})">${I.trash}</button></td></tr>`).join('')}</tbody></table><div class="p-3 border-t" style="border-color:var(--border)"><button class="btn btn-secondary" onclick="addRecLine()">${I.plus} Ajouter une ligne</button></div></div><div class="grid grid-cols-2 gap-4"><div><label class="label">Notes (sur chaque facture)</label><textarea class="input" rows="3" oninput="window._recForm.notes=this.value">${escape(f.notes)}</textarea></div><div class="card gc-teal p-3 text-sm"><div class="font-semibold mb-2">Aperçu</div><div class="flex justify-between"><span style="color:var(--muted)">Total facture</span><span class="font-bold">${fmtCAD(totals.total)}</span></div><div class="text-xs mt-2" style="color:var(--muted)">Génération ${({WEEKLY:'hebdomadaire',BIWEEKLY:'aux 2 semaines',MONTHLY:'mensuelle',QUARTERLY:'trimestrielle'})[f.interval]} à partir du <b>${fmtDate(f.nextRunAt)}</b>.</div></div></div><div class="flex justify-end gap-2 mt-4"><button class="btn btn-secondary" onclick="document.getElementById('rec-modal').remove()">Annuler</button><button class="btn btn-primary" onclick="saveRecurring()">Enregistrer</button></div></div>`}
function refreshRecForm(){document.getElementById('rec-modal').innerHTML=renderRecForm()}
function onRecActChange(idx,activityId){const a=state.activities.find(x=>x.id===activityId);window._recForm.items[idx].activityId=activityId;if(a)window._recForm.items[idx].taxStatus=a.taxStatus;refreshRecForm()}
function addRecLine(){window._recForm.items.push({activityId:'',description:'',quantity:1,unitPrice:0,taxStatus:'TAXABLE'});refreshRecForm()}
function removeRecLine(idx){if(window._recForm.items.length===1)return alert('Au moins une ligne est requise.');window._recForm.items.splice(idx,1);refreshRecForm()}
function saveRecurring(){const f=window._recForm;if(!f.name)return alert('Donne un nom au modèle.');if(f.items.some(i=>!i.description||i.quantity<=0))return alert('Toutes les lignes doivent être complètes.');if(f.editId){Object.assign(state.recurringTemplates.find(t=>t.id===f.editId),f)}else state.recurringTemplates.push({id:uid(),name:f.name,clientId:f.clientId,interval:f.interval,startDate:f.startDate,nextRunAt:f.nextRunAt,lastRunAt:null,active:true,autoStatus:f.autoStatus,items:f.items,notes:f.notes});saveState();document.getElementById('rec-modal').remove();toast('✓ Modèle enregistré');render()}
function toggleRecurring(id){const t=state.recurringTemplates.find(x=>x.id===id);t.active=!t.active;saveState();render()}

// === DÉPENSES (CRUD) ===
function renderDepenses(){return `<div class="flex justify-end mb-4 gap-2"><button class="btn btn-secondary" onclick="exportCSV()">${I.download} Export CSV</button><button class="btn btn-primary" onclick="openExpenseModal()">${I.plus} Nouvelle dépense</button></div><div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>Date</th><th>Catégorie</th><th>Description</th><th>Fournisseur</th><th class="text-right">Sous-total</th><th class="text-right">TPS</th><th class="text-right">TVQ</th><th class="text-right">Total</th><th></th></tr></thead><tbody>${state.expenses.length===0?`<tr><td colspan="9" class="text-center" style="color:var(--muted)">Aucune dépense</td></tr>`:state.expenses.map(e=>{const cat=state.expenseCategories.find(c=>c.id===e.categoryId);return `<tr><td>${fmtDate(e.date)}</td><td>${escape(cat?.name||'—')}</td><td>${escape(e.description)}${e.receiptDataUrl?' <span class="badge ml-1" title="Reçu joint" style="background:#10b98120;color:#059669">📎</span>':''}</td><td>${escape(e.vendor||'—')}</td><td class="text-right">${fmtCAD(e.subtotal)}</td><td class="text-right">${fmtCAD(e.tps)}</td><td class="text-right">${fmtCAD(e.tvq)}</td><td class="text-right font-medium">${fmtCAD(e.amount)}</td><td class="text-right">${e.receiptDataUrl?`<button class="btn-ghost btn" title="Voir reçu" onclick="viewReceipt('${e.id}')">${I.eye}</button>`:''}<button class="btn-ghost btn" onclick="openExpenseModal('${e.id}')">${I.edit}</button><button class="btn-ghost btn" style="color:#ef4444" onclick="deleteExpense('${e.id}')">${I.trash}</button></td></tr>`}).join('')}</tbody></table></div>`}
function openExpenseModal(id){const today=toISODate(new Date()),modal=document.createElement('div');modal.className='modal-bg';modal.id='exp-modal';if(id){const e=state.expenses.find(x=>x.id===id);window._expForm={editId:id,date:e.date,description:e.description,vendor:e.vendor||'',categoryId:e.categoryId,subtotal:e.subtotal,tps:e.tps,tvq:e.tvq,amount:e.amount,autoDecompose:false,receiptDataUrl:e.receiptDataUrl||'',receiptName:e.receiptName||'',receiptType:e.receiptType||''}}else window._expForm={editId:null,date:today,description:'',vendor:'',categoryId:state.expenseCategories[0]?.id,subtotal:0,tps:0,tvq:0,amount:0,autoDecompose:false,receiptDataUrl:'',receiptName:'',receiptType:''};modal.innerHTML=renderExpenseForm();document.body.appendChild(modal)}
function renderExpenseForm(){const f=window._expForm;let body;if(f.autoDecompose){const d=f.amount>0?decomposeFromTotal(f.amount,state.settings.tpsRate,state.settings.tvqRate):null;body=`<div><label class="label">Total payé (taxes incluses)</label><input class="input" type="number" step="0.01" value="${f.amount}" oninput="window._expForm.amount=Number(this.value); refreshExpForm()"></div>${d?`<div class="text-xs mt-2 p-2 rounded" style="background:var(--bg);color:var(--muted)">Décomposé : ${fmtCAD(d.subtotal)} + TPS ${fmtCAD(d.tps)} + TVQ ${fmtCAD(d.tvq)}</div>`:''}`}else body=`<div class="grid grid-cols-4 gap-2"><div><label class="label">Sous-total</label><input class="input" type="number" step="0.01" value="${f.subtotal}" oninput="window._expForm.subtotal=Number(this.value); refreshExpForm()"></div><div><label class="label">TPS</label><input class="input" type="number" step="0.01" value="${f.tps}" oninput="window._expForm.tps=Number(this.value); refreshExpForm()"></div><div><label class="label">TVQ</label><input class="input" type="number" step="0.01" value="${f.tvq}" oninput="window._expForm.tvq=Number(this.value); refreshExpForm()"></div><div><label class="label">Total</label><input class="input" type="number" step="0.01" value="${round2(f.subtotal+f.tps+f.tvq)}" disabled></div></div>`;return `<form class="card p-6 w-full max-w-2xl space-y-3" onsubmit="event.preventDefault(); saveExpense()"><div class="text-lg font-semibold">${f.editId?'Modifier':'Nouvelle'} dépense</div><div class="grid grid-cols-2 gap-3"><div><label class="label">Date</label><input class="input" type="date" value="${f.date}" oninput="window._expForm.date=this.value"></div><div><label class="label">Catégorie</label><select class="input" onchange="window._expForm.categoryId=this.value">${state.expenseCategories.map(c=>`<option value="${c.id}" ${c.id===f.categoryId?'selected':''}>${escape(c.name)}</option>`).join('')}</select></div></div><div><label class="label">Description</label><input class="input" required value="${escape(f.description)}" oninput="window._expForm.description=this.value"></div><div><label class="label">Fournisseur</label><input class="input" value="${escape(f.vendor)}" oninput="window._expForm.vendor=this.value"></div><label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" ${f.autoDecompose?'checked':''} onchange="window._expForm.autoDecompose=this.checked; refreshExpForm()"> Décomposer automatiquement depuis le total TTC</label>${body}<div class="card gc-emerald p-3 mt-2"><div class="text-xs font-semibold mb-2" style="color:var(--muted)">📸 REÇU (optionnel — photo ou PDF, max 15 Mo)</div>${f.receiptDataUrl?`<div class="flex items-center gap-3"><div style="width:60px;height:60px;background:#f3f4f6;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden">${f.receiptType&&f.receiptType.startsWith('image/')?`<img src="${f.receiptDataUrl}" style="max-width:100%;max-height:100%;object-fit:cover">`:'<div style="font-size:24px">📄</div>'}</div><div class="flex-1 text-sm"><div class="font-medium truncate">${escape(f.receiptName)}</div><div class="text-xs" style="color:var(--muted)">Cliquer ci-contre pour remplacer</div></div><button type="button" class="btn-ghost btn" style="color:#ef4444" onclick="onReceiptUpload(null)">${I.trash}</button></div>`:`<label class="block w-full p-3 border-2 border-dashed rounded-lg cursor-pointer text-center hover:bg-gray-50" style="border-color:var(--border);color:var(--muted)"><input type="file" accept="image/*,application/pdf" style="display:none" onchange="onReceiptUpload(this.files[0])">📷 Cliquer pour ajouter une photo ou un PDF du reçu</label>`}</div><div class="flex justify-end gap-2 pt-3"><button type="button" class="btn btn-secondary" onclick="document.getElementById('exp-modal').remove()">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div></form>`}
function refreshExpForm(){document.getElementById('exp-modal').innerHTML=renderExpenseForm()}
function saveExpense(){const f=window._expForm;if(!f.description)return alert('Description requise.');let{subtotal,tps,tvq,amount}=f;if(f.autoDecompose){const d=decomposeFromTotal(f.amount,state.settings.tpsRate,state.settings.tvqRate);subtotal=d.subtotal;tps=d.tps;tvq=d.tvq;amount=d.total}else amount=round2(subtotal+tps+tvq);if(f.editId){Object.assign(state.expenses.find(e=>e.id===f.editId),{date:f.date,description:f.description,vendor:f.vendor,categoryId:f.categoryId,subtotal,tps,tvq,amount,receiptDataUrl:f.receiptDataUrl,receiptName:f.receiptName,receiptType:f.receiptType});toast('✓ Dépense modifiée')}else state.expenses.unshift({id:uid(),date:f.date,description:f.description,vendor:f.vendor,categoryId:f.categoryId,subtotal,tps,tvq,amount,receiptDataUrl:f.receiptDataUrl,receiptName:f.receiptName,receiptType:f.receiptType,submittedToAccountant:false});saveState();document.getElementById('exp-modal').remove();render()}
function deleteExpense(id){if(!confirm('Supprimer cette dépense ?'))return;state.expenses=state.expenses.filter(e=>e.id!==id);saveState();render()}
function exportCSV(){const head='Date,Catégorie,Fournisseur,Description,Sous-total,TPS,TVQ,Total\n';const rows=state.expenses.map(e=>{const cat=state.expenseCategories.find(c=>c.id===e.categoryId),clean=s=>String(s??'').replace(/[",\n]/g,' ');return[e.date,clean(cat?.name),clean(e.vendor),clean(e.description),e.subtotal,e.tps,e.tvq,e.amount].join(',')}).join('\n');downloadFile('depenses.csv','text/csv;charset=utf-8',head+rows)}
function downloadFile(name,type,content){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

// === TAXES ===
let taxPeriod=(()=>{const now=new Date(),qS=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1),qE=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3+3,0);return{from:toISODate(qS),to:toISODate(qE)}})();
function renderTaxes(){const from=new Date(taxPeriod.from),to=new Date(taxPeriod.to);const invs=state.invoices.filter(i=>{if(i.status!=='PAID'&&i.status!=='SENT')return false;const d=new Date(i.issueDate);return d>=from&&d<=to});const exps=state.expenses.filter(e=>{const d=new Date(e.date);return d>=from&&d<=to});const tpsCol=round2(invs.reduce((s,i)=>s+i.tps,0)),tvqCol=round2(invs.reduce((s,i)=>s+i.tvq,0)),revTax=round2(invs.reduce((s,i)=>s+i.taxableBase,0)),revExe=round2(invs.reduce((s,i)=>s+i.exemptBase,0));const tpsITC=round2(exps.filter(e=>state.expenseCategories.find(c=>c.id===e.categoryId)?.reclaimGST).reduce((s,e)=>s+e.tps,0));const tvqITR=round2(exps.filter(e=>state.expenseCategories.find(c=>c.id===e.categoryId)?.reclaimQST).reduce((s,e)=>s+e.tvq,0));const byAct={};invs.forEach(inv=>inv.items.forEach(it=>{const a=state.activities.find(x=>x.id===it.activityId),k=a?.name||'Autre';byAct[k]=byAct[k]||{taxable:0,exempt:0};if(it.taxStatus==='TAXABLE')byAct[k].taxable+=it.lineTotal;else byAct[k].exempt+=it.lineTotal}));const row=(l,v)=>`<div class="flex justify-between text-sm"><span style="color:var(--muted)">${l}</span><span>${v}</span></div>`;return `<div class="card p-4 flex flex-wrap items-end gap-3 mb-4"><div><label class="label">Du</label><input class="input" type="date" value="${taxPeriod.from}" onchange="taxPeriod.from=this.value; render()"></div><div><label class="label">Au</label><input class="input" type="date" value="${taxPeriod.to}" onchange="taxPeriod.to=this.value; render()"></div><div class="flex gap-2 ml-auto"><button class="btn btn-secondary" onclick="quickPeriod('Q1')">T1</button><button class="btn btn-secondary" onclick="quickPeriod('Q2')">T2</button><button class="btn btn-secondary" onclick="quickPeriod('Q3')">T3</button><button class="btn btn-secondary" onclick="quickPeriod('Q4')">T4</button><button class="btn btn-secondary" onclick="quickPeriod('YEAR')">Année</button></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">${statCard('Revenus taxables',fmtCAD(revTax),'gc-teal',null,'#0f766e')}${statCard('Revenus exonérés',fmtCAD(revExe),'gc-amber',null,'#f59e0b')}${statCard('Total revenus',fmtCAD(revTax+revExe),'gc-emerald',null,'#10b981')}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div class="card gc-teal p-4 space-y-2"><div class="text-base font-semibold">TPS (5 %)</div>${row('TPS perçue',fmtCAD(tpsCol))}${row('CTI (crédit intrants)','− '+fmtCAD(tpsITC))}<div class="border-t pt-2 font-bold flex justify-between" style="border-color:var(--border)"><span>À remettre</span><span style="color:#0f766e">${fmtCAD(round2(tpsCol-tpsITC))}</span></div></div><div class="card gc-indigo p-4 space-y-2"><div class="text-base font-semibold">TVQ (9.975 %)</div>${row('TVQ perçue',fmtCAD(tvqCol))}${row('RTI (remboursement intrants)','− '+fmtCAD(tvqITR))}<div class="border-t pt-2 font-bold flex justify-between" style="border-color:var(--border)"><span>À remettre</span><span style="color:#6366f1">${fmtCAD(round2(tvqCol-tvqITR))}</span></div></div></div><div class="card p-4"><div class="font-semibold mb-3">Revenus par activité</div><table class="w-full"><thead><tr><th>Activité</th><th class="text-right">Taxable</th><th class="text-right">Exonéré</th></tr></thead><tbody>${Object.keys(byAct).length===0?`<tr><td colspan="3" class="text-center" style="color:var(--muted)">Aucune donnée</td></tr>`:Object.entries(byAct).map(([k,v])=>`<tr><td>${escape(k)}</td><td class="text-right">${fmtCAD(v.taxable)}</td><td class="text-right">${fmtCAD(v.exempt)}</td></tr>`).join('')}</tbody></table></div>`}
function quickPeriod(p){const now=new Date(),Y=now.getFullYear(),m={Q1:[0,2],Q2:[3,5],Q3:[6,8],Q4:[9,11],YEAR:[0,11]}[p];taxPeriod.from=toISODate(new Date(Y,m[0],1));taxPeriod.to=toISODate(new Date(Y,m[1]+1,0));render()}

// === RAPPORTS P&L ===
let pnlPeriod=(()=>{const now=new Date();return{from:toISODate(new Date(now.getFullYear(),0,1)),to:toISODate(now)}})();
function renderRapports(){const from=new Date(pnlPeriod.from),to=new Date(pnlPeriod.to);const invs=state.invoices.filter(i=>{const d=new Date(i.issueDate);return d>=from&&d<=to});const exps=state.expenses.filter(e=>{const d=new Date(e.date);return d>=from&&d<=to});const byAct={};let revenue=0;invs.forEach(inv=>{revenue+=inv.taxableBase+inv.exemptBase;inv.items.forEach(it=>{const a=state.activities.find(x=>x.id===it.activityId),k=a?.name||'Autre';byAct[k]=(byAct[k]||0)+it.lineTotal})});const byCat={};let expenseTot=0;exps.forEach(e=>{const c=state.expenseCategories.find(x=>x.id===e.categoryId),ded=c?.reclaimGST&&c?.reclaimQST?e.subtotal:e.amount;expenseTot+=ded;byCat[c?.name||'Autre']=(byCat[c?.name||'Autre']||0)+ded});const profit=round2(revenue-expenseTot);return `<div class="card p-4 flex flex-wrap items-end gap-3 mb-4"><div><label class="label">Du</label><input class="input" type="date" value="${pnlPeriod.from}" onchange="pnlPeriod.from=this.value; render()"></div><div><label class="label">Au</label><input class="input" type="date" value="${pnlPeriod.to}" onchange="pnlPeriod.to=this.value; render()"></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="card p-4"><div class="font-semibold mb-3">Revenus par activité</div><table class="w-full"><tbody>${Object.entries(byAct).map(([k,v])=>`<tr><td>${escape(k)}</td><td class="text-right">${fmtCAD(v)}</td></tr>`).join('')}<tr class="font-bold"><td>Total revenus</td><td class="text-right">${fmtCAD(revenue)}</td></tr></tbody></table></div><div class="card p-4"><div class="font-semibold mb-3">Dépenses par catégorie</div><table class="w-full"><tbody>${Object.entries(byCat).map(([k,v])=>`<tr><td>${escape(k)}</td><td class="text-right">${fmtCAD(v)}</td></tr>`).join('')}<tr class="font-bold"><td>Total dépenses</td><td class="text-right">${fmtCAD(expenseTot)}</td></tr></tbody></table></div></div><div class="card ${profit>=0?'gc-emerald':'gc-rose'} p-6 mt-4 flex items-center justify-between"><span class="text-lg font-semibold">Profit net</span><span class="text-3xl font-bold" style="color:${profit>=0?'#10b981':'#ef4444'}">${fmtCAD(profit)}</span></div>`}

// === FIN D'ANNÉE / COMPTABLE ===
let fiscalYear=new Date().getFullYear();
function renderComptable(){const Y=fiscalYear,start=new Date(Y,0,1),end=new Date(Y,11,31,23,59,59);const invs=state.invoices.filter(i=>{const d=new Date(i.issueDate);return d>=start&&d<=end});const exps=state.expenses.filter(e=>{const d=new Date(e.date);return d>=start&&d<=end});const quarters=[0,1,2,3].map(q=>{const qs=new Date(Y,q*3,1),qe=new Date(Y,q*3+3,0,23,59,59);const qInv=invs.filter(i=>{const d=new Date(i.issueDate);return d>=qs&&d<=qe});const qExp=exps.filter(e=>{const d=new Date(e.date);return d>=qs&&d<=qe});return{label:`T${q+1}`,revTax:round2(qInv.reduce((s,i)=>s+i.taxableBase,0)),revExe:round2(qInv.reduce((s,i)=>s+i.exemptBase,0)),tps:round2(qInv.reduce((s,i)=>s+i.tps,0)),tvq:round2(qInv.reduce((s,i)=>s+i.tvq,0)),tpsITC:round2(qExp.filter(e=>state.expenseCategories.find(c=>c.id===e.categoryId)?.reclaimGST).reduce((s,e)=>s+e.tps,0)),tvqITR:round2(qExp.filter(e=>state.expenseCategories.find(c=>c.id===e.categoryId)?.reclaimQST).reduce((s,e)=>s+e.tvq,0)),expTotal:round2(qExp.reduce((s,e)=>s+e.amount,0))}});const totRevTax=round2(invs.reduce((s,i)=>s+i.taxableBase,0)),totRevExe=round2(invs.reduce((s,i)=>s+i.exemptBase,0)),totTps=round2(invs.reduce((s,i)=>s+i.tps,0)),totTvq=round2(invs.reduce((s,i)=>s+i.tvq,0)),totExp=round2(exps.reduce((s,e)=>s+e.amount,0)),totExpDed=round2(exps.reduce((s,e)=>{const c=state.expenseCategories.find(x=>x.id===e.categoryId);return s+(c?.reclaimGST&&c?.reclaimQST?e.subtotal:e.amount)},0)),profit=round2(totRevTax+totRevExe-totExpDed);const submInv=invs.filter(i=>i.submittedToAccountant).length,submExp=exps.filter(e=>e.submittedToAccountant).length;return `<div class="card gc-indigo p-4 mb-4"><div class="flex items-start gap-3"><div style="font-size:24px">📋</div><div class="flex-1"><div class="font-semibold mb-1">Dossier annuel pour le comptable</div><div class="text-sm" style="color:var(--muted)">Tout ce dont ton comptable a besoin : résumé annuel, ventilation trimestrielle TPS/TVQ, liste détaillée. <b>Coche les pièces remises</b> au fur et à mesure. Bouton « Récapitulatif HTML » génère une page imprimable en PDF.</div></div></div></div><div class="card p-4 flex flex-wrap items-center gap-3 mb-4"><label class="label mb-0">Année fiscale</label><select class="input" style="width:auto" onchange="fiscalYear=Number(this.value); render()">${[Y-2,Y-1,Y,Y+1].map(y=>`<option value="${y}" ${y===Y?'selected':''}>${y}</option>`).join('')}</select><div class="ml-auto flex gap-2"><button class="btn btn-secondary" onclick="exportFacturesAnnee(${Y})">${I.download} Factures ${Y}.csv</button><button class="btn btn-secondary" onclick="exportDepensesAnnee(${Y})">${I.download} Dépenses ${Y}.csv</button><button class="btn btn-primary" onclick="exportRecapitulatif(${Y})">${I.download} Récapitulatif HTML</button></div></div><div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">${statCard('Revenus '+Y,fmtCAD(totRevTax+totRevExe),'gc-emerald',`Taxables ${fmtCAD(totRevTax)} · Exonérés ${fmtCAD(totRevExe)}`,'#10b981')}${statCard('Dépenses '+Y,fmtCAD(totExp),'gc-amber',null,'#f59e0b')}${statCard('Profit net',fmtCAD(profit),profit>=0?'gc-teal':'gc-rose',null,profit>=0?'#0f766e':'#ef4444')}${statCard('Pièces remises',`${submInv}/${invs.length} fact · ${submExp}/${exps.length} dép`,'gc-indigo',null,'#6366f1')}</div><div class="card p-4 mb-4"><div class="font-semibold mb-3">Ventilation TPS / TVQ par trimestre — ${Y}</div><table class="w-full text-sm"><thead><tr><th>Trim.</th><th class="text-right">Rev. tax.</th><th class="text-right">Rev. exo.</th><th class="text-right">TPS perçue</th><th class="text-right">CTI</th><th class="text-right">TPS à remettre</th><th class="text-right">TVQ perçue</th><th class="text-right">RTI</th><th class="text-right">TVQ à remettre</th></tr></thead><tbody>${quarters.map(q=>`<tr><td class="font-medium">${q.label} ${Y}</td><td class="text-right">${fmtCAD(q.revTax)}</td><td class="text-right">${fmtCAD(q.revExe)}</td><td class="text-right">${fmtCAD(q.tps)}</td><td class="text-right">− ${fmtCAD(q
