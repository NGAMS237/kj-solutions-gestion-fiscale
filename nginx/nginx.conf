user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 25M;

  upstream frontend_upstream { server frontend:3000; }
  upstream backend_upstream  { server backend:4000;  }

  # ---- HTTP : redirige tout vers HTTPS en prod (commenter en dev local) ----
  server {
    listen 80 default_server;
    server_name _;

    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ---- HTTPS (activer après installation Let's Encrypt) ----
  # server {
  #   listen 443 ssl http2;
  #   server_name votre-domaine.ca;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_prefer_server_ciphers on;
  #
  #   location /api/ { proxy_pass http://backend_upstream;  ... }
  #   location /     { proxy_pass http://frontend_upstream; ... }
  # }
}
